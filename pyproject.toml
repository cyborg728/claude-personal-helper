[project]
name = "claude-personal-helper"
version = "1.0.0"
description = "Personal Telegram assistant bot with translation capabilities"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[webhooks]>=22.0",
    "sqlmodel>=0.0.24",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "litestar>=2.15",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fluent-runtime>=0.4",
    "google-genai>=1.0",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"
