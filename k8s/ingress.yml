apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tg-assistant
  namespace: tg-assistant
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - tg-assistant.f-f.dev
      secretName: tg-assistant-tls
  rules:
    - host: tg-assistant.f-f.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tg-assistant
                port:
                  number: 80
