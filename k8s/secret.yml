apiVersion: v1
kind: Secret
metadata:
  name: tg-assistant-secret
  namespace: tg-assistant
type: Opaque
stringData:
  BOT_BOT_TOKEN: "YOUR_BOT_TOKEN"
  BOT_ADMIN_USERNAME: "YOUR_ADMIN_USERNAME"
  BOT_DATABASE_URL: "postgresql+asyncpg://postgres:password@postgres:5432/tg_assistant"
  BOT_GEMINI_API_KEY: "YOUR_GEMINI_API_KEY"
  BOT_GEMINI_MODEL: "gemini-2.0-flash"
  BOT_WEBHOOK_SECRET: "YOUR_RANDOM_SECRET_STRING"
  # PostgreSQL
  POSTGRES_DB: "tg_assistant"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "password"
